name: E2E

on:
  pull_request:
    branches: [main]
    # Skip E2E for PRs that only touch docs or backend SQL — the Playwright
    # suite exercises frontend flows, so it has nothing to validate there.
    # A PR that also touches app code still runs (paths-ignore only skips when
    # every changed file matches). DB-only changes rely on pgTAP (test:db).
    paths-ignore:
      - 'docs/**'
      - 'supabase/**'
      - '**/*.md'

jobs:
  e2e:
    name: Playwright + axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level so the build step and the test step (whose env the Playwright
    # webServer, i.e. `bun run start`, inherits) see the same values.
    # NEXT_PUBLIC_* are inlined at `next build` time, so they must be present
    # while building, not only at runtime. The URL and anon key are public by
    # design, so they may live in repository variables or secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Links in emails the app sends during the run (OTP, etc.).
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Server-only. /api/auth/login and /api/auth/verify-otp use the admin
      # client to store and check the OTP, so no MFA login works without it.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # SMTP creds for the app-under-test's own OTP send (src/lib/email/otp.ts).
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      TEST_CSO_EMAIL: ${{ secrets.TEST_CSO_EMAIL }}
      TEST_CSO_PASSWORD: ${{ secrets.TEST_CSO_PASSWORD }}
      TEST_DEAN_EMAIL: ${{ secrets.TEST_DEAN_EMAIL }}
      TEST_DEAN_PASSWORD: ${{ secrets.TEST_DEAN_PASSWORD }}
      TEST_VERIFIER_EMAIL: ${{ secrets.TEST_VERIFIER_EMAIL }}
      TEST_VERIFIER_PASSWORD: ${{ secrets.TEST_VERIFIER_PASSWORD }}
      TEST_REQUESTER_EMAIL: ${{ secrets.TEST_REQUESTER_EMAIL }}
      TEST_REQUESTER_PASSWORD: ${{ secrets.TEST_REQUESTER_PASSWORD }}
      # Shared IMAP mailbox tests/e2e/utils/otp.ts reads CSO/DEAN/VERIFIER
      # codes from.
      E2E_OTP_IMAP_USER: ${{ secrets.E2E_OTP_IMAP_USER }}
      E2E_OTP_IMAP_APP_PASSWORD: ${{ secrets.E2E_OTP_IMAP_APP_PASSWORD }}

    steps:
      # Fail in seconds with the names of what is missing, instead of building
      # for minutes and then timing out on the login screen
      # ("supabaseUrl is required" in the webServer log).
      - name: Check required secrets
        run: |
          missing=()
          for name in \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_ROLE_KEY GMAIL_USER GMAIL_APP_PASSWORD \
            TEST_CSO_EMAIL TEST_CSO_PASSWORD TEST_DEAN_EMAIL TEST_DEAN_PASSWORD \
            TEST_VERIFIER_EMAIL TEST_VERIFIER_PASSWORD \
            TEST_REQUESTER_EMAIL TEST_REQUESTER_PASSWORD \
            E2E_OTP_IMAP_USER E2E_OTP_IMAP_APP_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=E2E secrets missing::Add these repository secrets (Settings > Secrets and variables > Actions): ${missing[*]}. See docs/TESTING.md."
            exit 1
          fi
          echo "Every required secret is set."

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Build
        run: bun run build

      # chromium only on PRs for speed; the mobile (Pixel 5) project is omitted here.
      - name: Run E2E tests
        run: bun run test:e2e -- --project=chromium
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
