name: E2E

on:
  pull_request:
    branches: [main]
    # Skip E2E for PRs that only touch docs or backend SQL — the Playwright
    # suite exercises frontend flows, so it has nothing to validate there.
    # A PR that also touches app code still runs (paths-ignore only skips when
    # every changed file matches). DB-only changes rely on pgTAP (test:db).
    paths-ignore:
      - 'docs/**'
      - 'supabase/**'
      - '**/*.md'

jobs:
  e2e:
    name: Playwright + axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # chromium only on PRs for speed; the mobile (Pixel 5) project is omitted here.
      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_CSO_EMAIL: ${{ secrets.TEST_CSO_EMAIL }}
          TEST_CSO_PASSWORD: ${{ secrets.TEST_CSO_PASSWORD }}
          TEST_DEAN_EMAIL: ${{ secrets.TEST_DEAN_EMAIL }}
          TEST_DEAN_PASSWORD: ${{ secrets.TEST_DEAN_PASSWORD }}
          TEST_VERIFIER_EMAIL: ${{ secrets.TEST_VERIFIER_EMAIL }}
          TEST_VERIFIER_PASSWORD: ${{ secrets.TEST_VERIFIER_PASSWORD }}
          TEST_REQUESTER_EMAIL: ${{ secrets.TEST_REQUESTER_EMAIL }}
          TEST_REQUESTER_PASSWORD: ${{ secrets.TEST_REQUESTER_PASSWORD }}
          # Shared IMAP mailbox that reads the real OTP emails sent to the
          # CSO/DEAN/VERIFIER test accounts above — see docs/E2E_OTP_SETUP.md.
          E2E_OTP_IMAP_USER: ${{ secrets.E2E_OTP_IMAP_USER }}
          E2E_OTP_IMAP_APP_PASSWORD: ${{ secrets.E2E_OTP_IMAP_APP_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
